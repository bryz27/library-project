<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library Project</title>
</head>

<body>
    <!-- <button command="show-modal" commandfor="my-dialog">Open Dialog</button>

    <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="my-dialog" command="close">Close</button>
    </dialog> -->

    <!-- Main Frame -->
    <div class="main-frame">
        <div class="title-container">
            <h1 class="main-title">Book Collection</h1>
        </div>
        <div class="newBtn-container">
            <button class="btn-new-book" command="show-modal" commandfor="new-book">New Book</button>
        </div>
        <div class="list-container">

        </div>
    </div>

    <!-- New Book Dialog -->
    <dialog id="new-book">
        <form action="submit" method="post">
            <div class="input-container">
                <input type="text" name="title" id="title">
                <label for="title">Title:</label>
            </div>
            <div class="input-container">
                <input type="text" name="author" id="author">
                <label for="author">Author:</label>
            </div>
            <div class="input-container">
                <input type="text" name="pages" id="pages">
                <label for="pages">Pages:</label>
            </div>
            <div class="checkbox-container">
                <input type="checkbox" name="read" id="read">
                <label for="read">Read:</label>
            </div>
            <div class="button-container">
                <button commandfor="new-book" command="close" id="btn-close">Close</button>
                <button commandfor="new-book" command="submit" id="btn-submit">Submit</button>
            </div>
        </form>
    </dialog>
</body>

</html>
