<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library Project</title>
</head>

<body>
    <!-- <button command="show-modal" commandfor="my-dialog">Open Dialog</button>

    <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="my-dialog" command="close">Close</button>

    <div class="main-frame">
        <h1 class="main-title">Book Collection</h1>
        <button class="btn-new-book" command="show-modal" commandfor="new-book">New Book</button>
        <div class="list-frame">

        </div>
    </div>

    <dialog id="new-book">
        <input type="text" name="title" id="title">
        <label for="title">Title:</label>
        <input type="text" name="author" id="author">
        <label for="author">Author:</label>
        <input type="text" name="pages" id="pages">
        <label for="pages">Pages:</label>
        <input type="checkbox" name="read" id="read">
        <label for="read">Read:</label>
        <button commandfor="new-book" command="close">Close</button>
        <button commandfor="new-book" command="submit">Submit</button>
    </dialog>
</body>

</html>
