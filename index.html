<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library Project</title>
</head>

<body>
    <!-- <button command="show-modal" commandfor="my-dialog">Open Dialog</button>

    <dialog id="my-dialog">
        <p>This dialog was opened using an invoker command.</p>
        <button commandfor="my-dialog" command="close">Close</button>
    </dialog> -->

    <!-- Main Frame -->
    <div class="main-frame">
        <div class="title-container">
            <h1 class="main-title">Book Collection</h1>
            <div class="newBtn-container">
                <button class="btn-new-book" command="show-modal" commandfor="new-book">New Book</button>
            </div>
        </div>
        <div class="list-container">

        </div>
    </div>

    <!-- New Book Dialog -->
    <dialog id="new-book">
        <form id="form">
            <div class="input-container">
                <input type="text" name="title" id="title" placeholder=" " required>
                <label for="title">Title</label>
            </div>
            <div class="input-container">
                <input type="text" name="author" id="author" placeholder=" " required>
                <label for="author">Author</label>
            </div>
            <div class="input-container">
                <input type="text" name="pages" id="pages" placeholder=" " required>
                <label for="pages">Pages</label>
            </div>
            <div class="checkbox-container">
                <input type="checkbox" name="read" id="read">
                <label for="read">Read</label>
            </div>
            <div class="button-container">
                <button type="button" id="btn-close" command="close" commandfor="new-book">Close</button>
                <button type="submit" id="btn-submit">Submit</button>
            </div>
        </form>
    </dialog>

    <template id="book-card-template">
        <div class="book-card">
            <h2 class="book-title"></h2>
            <p class="book-author"></p>
            <p class="book-pages"></p>
            <p class="book-read"></p>
        </div>
    </template>
</body>

</html>
